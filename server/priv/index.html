<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>sbwy</title>
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <h1>sbwy</h1>
    <p><em>subways! yay!</em></p>
    <p>An app showing subway arrival times for New York City.</p>
    <p>To use the app, view <a href="/stops/">stops nearby</a>.</p>
    <hr />
    <style>
      #screenshots-wrapper {
        background-color: var(--color-bg-1);
        /* padding: 0.5em; */
        border-radius: 0.5em;

        border: 0.5em solid var(--color-bg-1);

        display: flex;
        gap: 0.5em;
        justify-content: space-between;
        align-items: start;

        min-width: 0;
        overflow-x: scroll;
      }
      #screenshots-wrapper > figure {
        min-width: 284px;
        width: 33%;
        margin: 0;

        display: flex;
        flex-direction: column-reverse;
      }
      #screenshots-wrapper > figure > img {
        width: 100%;
        border: 1px solid lightblue;
        border-radius: 0.5em;
        box-sizing: border-box;
      }
      #screenshots-wrapper > figure > figcaption {
        text-align: center;
        /* font-style: italic; */
        font-size: small;
        margin-bottom: 0.5em;
      }
    </style>
    <section id="screenshots">
      <h2>Screenshots</h2>
      <div id="screenshots-wrapper">
        <figure>
          <img
            src="/static/screenshots/stops.jpg"
            alt="A screenshot of the stops page, showing favorite stops and stops nearby City Hall."
          />
          <figcaption>The stops page</figcaption>
        </figure>
        <figure>
          <img
            src="/static/screenshots/station.jpg"
            alt="A screenshot of the trains arriving at 14 St-Union Sq."
          />
          <figcaption>The trains arriving at 14 St-Union Sq</figcaption>
        </figure>
        <figure>
          <img
            src="/static/screenshots/train.jpg"
            alt="A screenshot of an Astoria-Ditmars Blvd-bound N train."
          />
          <figcaption>An Astoria-Ditmars Blvd-bound N train</figcaption>
        </figure>
      </div>
    </section>
    <hr />
    <p>
      The source code of this app is available on
      <a href="https://tangled.org/did:plc:tl2btz6plz46c2df422tvhbc">Tangled</a>
      or <a href="https://github.com/gavinmorrow/sbwy">Github</a>.
    </p>
  </body>
</html>
