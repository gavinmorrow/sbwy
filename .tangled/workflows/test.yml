when:
  - event: [push, pull_request, manual]
    branch: [main]

engine: microvm
image: nixos

dependencies:
  - gleam
  - erlang
  - nodejs
  - just

cache:
  - key: client-deps
    hash:
      - client/manifest.toml
    paths:
      - client/build/packages
  - key: server-deps
    hash:
      - server/manifest.toml
    paths:
      - server/build/packages

steps:
  - name: Test
    command: "just test"
